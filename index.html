        function updateBg() {

                fridgeEl.style.background = `linear-gradient(to bottom right, ${color1El.value}, ${color2El.value})`;
            }
        }

        function spawnWords(genre) {
            if (!fridgeEl || !magnetStripEl) return;
            
            const magnetsInFridge = fridgeEl.querySelectorAll('.magnet');
            magnetsInFridge.forEach(el => el.remove());
            
            magnetStripEl.innerHTML = ''; 
            magnetElements = [];
            
            wildcardsLeft = 3;
            if(document.getElementById('wildcard-input')) {
                document.getElementById('wildcard-input').placeholder = `+ custom (${wildcardsLeft})`;
                document.getElementById('wildcard-input').disabled = false;
                document.getElementById('btn-wildcard').disabled = false;
            }
            
            let selectedBase = [];
            for (const [type, wordsList] of Object.entries(baseWordsMap)) {
                let count = wordsList.length; 
                const subset = getRandomSubset(wordsList, count);
                subset.forEach(w => selectedBase.push({ text: w, type: type }));
            }

            const themeWords = getThemeWords(genre);
            const selectedTheme = getRandomSubset(themeWords, 300).map(w => ({ text: w, type: 'theme' }));

            let words = [...selectedBase, ...selectedTheme];
            words.sort(() => Math.random() - 0.5);

            words.forEach(wordObj => {
                const mag = document.createElement('div');
                mag.className = 'magnet in-strip';
                mag.textContent = wordObj.text;
                mag.dataset.type = wordObj.type; 
                mag.dataset.moved = "false"; 
                
                magnetStripEl.appendChild(mag);
                magnetElements.push(mag);
            });
        }

        function sortStrip(method) {
            if (!magnetStripEl) return;
            const stripChildren = Array.from(magnetStripEl.children);
            
            if (method === 'scatter') {
                stripChildren.sort(() => Math.random() - 0.5);
            } else if (method === 'alpha') {
                stripChildren.sort((a, b) => a.textContent.localeCompare(b.textContent));
            } else if (method === 'type') {
                const typeOrder = ['custom', 'suffixes', 'pronouns', 'connectors', 'verbs', 'adjectives', 'nouns', 'theme'];
                stripChildren.sort((a, b) => {
                    const rankA = typeOrder.indexOf(a.dataset.type);
                    const rankB = typeOrder.indexOf(b.dataset.type);
                    if (rankA !== rankB) return rankA - rankB;
                    return a.textContent.localeCompare(b.textContent);
                });
            }
            
            stripChildren.forEach(el => magnetStripEl.appendChild(el));
        }

        function generateRandomPoem() {
            if (!fridgeEl || !magnetStripEl) return;
            
            const genres = Object.keys(rawDictionaries);
            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            genreSelectEl.value = randomGenre;
            
            color1El.value = generateRandomPastel();
            color2El.value = generateRandomPastel();
            updateBg();

            spawnWords(randomGenre);

            const rawPool = {
                pronouns: magnetElements.filter(m => m.dataset.type === 'pronouns'),
                verbs: magnetElements.filter(m => m.dataset.type === 'verbs'),
                adjectives: magnetElements.filter(m => m.dataset.type === 'adjectives'),
                nouns: magnetElements.filter(m => m.dataset.type === 'nouns'), 
                theme: magnetElements.filter(m => m.dataset.type === 'theme'),
                connectors: magnetElements.filter(m => m.dataset.type === 'connectors'),
                suffixes: magnetElements.filter(m => m.dataset.type === 'suffixes')
            };

            const getWordsByText = (sourceArray, targetWords) => {
                return sourceArray.filter(el => targetWords.includes(el.textContent.toLowerCase()));
            };

            const articles = getWordsByText(rawPool.connectors, ['the', 'a', 'an']);
            const prepositions = getWordsByText(rawPool.connectors, ['in', 'on', 'at', 'from', 'by', 'with', 'under', 'over', 'through', 'for', 'to', 'of']);
            const copulas = getWordsByText(rawPool.connectors, ['is', 'are', 'was', 'were', 'am', 'be']);
            const conjunctions = getWordsByText(rawPool.connectors, ['and', 'but', 'or']);
            
            const subjectPronouns = getWordsByText(rawPool.pronouns, ['i', 'he', 'she', 'we', 'they', 'who']);
            const objectPronouns = getWordsByText(rawPool.pronouns, ['me', 'him', 'her', 'us', 'them']);
            const otherPronouns = rawPool.pronouns.filter(p => !subjectPronouns.includes(p) && !objectPronouns.includes(p));

            const pool = {
                articles: [...articles],
                prepositions: [...prepositions],
                copulas: [...copulas],
                conjunctions: [...conjunctions],
                subjectPronouns: [...subjectPronouns, ...otherPronouns], 
                objectPronouns: [...objectPronouns, ...otherPronouns],
                verbs: [...rawPool.verbs],
                adjectives: [...rawPool.adjectives],
                strictNouns: [...rawPool.nouns], 
                theme: [...rawPool.theme],
                allNouns: [...rawPool.nouns, ...rawPool.theme]
            };

            const pick = (type) => {
                let arr = pool[type];
                if (!arr || arr.length === 0) {
                    if (type === 'strictNouns') arr = pool.allNouns; 
                    else if (type === 'theme') arr = pool.allNouns; 
                    else return null; 
                }
                if (!arr || arr.length === 0) return null;
                const idx = Math.floor(Math.random() * arr.length);
                const el = arr[idx];
                arr.splice(idx, 1);
                return el;
            };

            const templates = [
                ['articles', 'adjectives', 'strictNouns', 'verbs', 'prepositions', 'articles', 'theme'],
                ['subjectPronouns', 'verbs', 'articles', 'theme'],
                ['prepositions', 'articles', 'strictNouns', 'subjectPronouns', 'verbs'],
                ['theme', 'copulas', 'adjectives'],
                ['verbs', 'objectPronouns', 'prepositions', 'theme']
            ];

            const lines = [];
            const stanzaStructure = templates.sort(() => 0.5 - Math.random()).slice(0, 4);

            stanzaStructure.forEach(pattern => {
                const lineWords = [];
                pattern.forEach(type => {
                    const wordEl = pick(type);
                    if (wordEl) lineWords.push(wordEl);
                });
                
                for (let i = 0; i < lineWords.length - 1; i++) {
                    const current = lineWords[i];
                    const next = lineWords[i+1];
                    const vowels = ['a','e','i','o','u'];
                    if (current.textContent === 'a' && vowels.includes(next.textContent[0].toLowerCase())) {
                        current.textContent = 'an'; 
                    } else if (current.textContent === 'an' && !vowels.includes(next.textContent[0].toLowerCase())) {
                        current.textContent = 'a';
                    }
                }
                if (lineWords.length > 0) lines.push(lineWords);
            });

            const boardRect = fridgeEl.getBoundingClientRect();
            const centerX = boardRect.width / 2;
            const centerY = boardRect.height / 2;
            const lineHeight = 42;
            const wordSpacing = 6;
            const totalHeight = lines.length * lineHeight;
            let currentY = centerY - (totalHeight / 2);

            lines.forEach(line => {
                let rowWidth = 0;
                line.forEach(el => {
                    el.classList.remove('in-strip');
                    el.classList.add('on-board');
                    fridgeEl.appendChild(el); 
                    rowWidth += el.offsetWidth + wordSpacing;
                });
                rowWidth -= wordSpacing;

                let currentX = centerX - (rowWidth / 2);
                currentX += (Math.random() * 20 - 10); 

                line.forEach(el => {
                    el.dataset.moved = "true";
                    el.style.position = 'absolute';
                    el.style.left = `${currentX}px`;
                    el.style.top = `${currentY}px`;
                    const rot = (Math.random() * 3) - 1.5;
                    el.style.transform = `rotate(${rot}deg)`;
                    currentX += el.offsetWidth + wordSpacing;
                });
                currentY += lineHeight;
            });
        }

        function toggleHelp() {
            const modal = document.getElementById('help-modal');
            if (!modal) return;
            const inner = modal.querySelector('div');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                void modal.offsetWidth; 
                modal.classList.remove('opacity-0');
                inner.classList.remove('scale-95');
                inner.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0');
                inner.classList.remove('scale-100');
                inner.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function playStickSound() {
            if (!audioCtx) return;
            // Force wakeup if suspended
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const t = audioCtx.currentTime;
            
            // 1. The "Thwip" (Swept Bandpass Noise)
            // The frequency sweep creates the "air" sound
            const bufferSize = audioCtx.sampleRate * 0.08; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            const noiseFilter = audioCtx.createBiquadFilter();
            
            noiseFilter.type = 'bandpass';
            noiseFilter.Q.value = 0.5; // Wide Q for a breathy/paper sound
            
            // The Sweep: Start high (air), end low (contact)
            noiseFilter.frequency.setValueAtTime(3000, t); 
            noiseFilter.frequency.exponentialRampToValueAtTime(200, t + 0.04);
            
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            
            // Muted envelope - significant volume reduction
            noiseGain.gain.setValueAtTime(0, t);
            noiseGain.gain.linearRampToValueAtTime(0.15, t + 0.005); // Reduced from 0.5
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            
            noise.start(t);
            
            // 2. The Tap (Subtle Sine)
            // Just enough to prove it hit a solid surface
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(180, t); // Lower pitch for less "ping"
            
            oscGain.gain.setValueAtTime(0, t);
            oscGain.gain.linearRampToValueAtTime(0.015, t + 0.002); // Reduced from 0.05
            oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03); 
            
            osc.start(t);
            osc.stop(t + 0.05);
        }

        function init() {
            fridgeEl = document.getElementById('fridge');
            magnetStripEl = document.getElementById('magnet-strip');
            genreSelectEl = document.getElementById('genre-select');
            color1El = document.getElementById('bg-color-1');
            color2El = document.getElementById('bg-color-2');

            const genres = Object.keys(rawDictionaries);
            genres.forEach(genre => {
                const opt = document.createElement('option');
                opt.value = genre;
                opt.textContent = genre;
                genreSelectEl.appendChild(opt);
            });

            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            genreSelectEl.value = randomGenre;

            genreSelectEl.addEventListener('change', (e) => spawnWords(e.target.value));
            color1El.addEventListener('input', updateBg);
            color2El.addEventListener('input', updateBg);
            
            document.getElementById('btn-reset').addEventListener('click', () => {
                color1El.value = generateRandomPastel();
                color2El.value = generateRandomPastel();
                updateBg();
                spawnWords(genreSelectEl.value);
            });
            
            document.getElementById('btn-random').addEventListener('click', generateRandomPoem);

            document.getElementById('btn-wildcard').addEventListener('click', () => {
                const input = document.getElementById('wildcard-input');
                const val = input.value.trim();
                if (!val || wildcardsLeft <= 0) return;

                wildcardsLeft--;
                input.placeholder = `+ custom (${wildcardsLeft})`;
                input.value = '';
                if (wildcardsLeft === 0) {
                    input.placeholder = `Limit reached`;
                    input.disabled = true;
                    document.getElementById('btn-wildcard').disabled = true;
                }

                const mag = document.createElement('div');
                mag.className = 'magnet on-board';
                mag.style.position = 'absolute';
                mag.style.left = (fridgeEl.offsetWidth / 2 - 30) + 'px';
                mag.style.top = (fridgeEl.offsetHeight / 2 - 15) + 'px';
                mag.textContent = val;
                mag.dataset.type = 'custom';
                mag.dataset.moved = 'true'; 
                
                fridgeEl.appendChild(mag);
                magnetElements.push(mag);
            });

            document.getElementById('btn-capture').addEventListener('click', async () => {
                const btn = document.getElementById('btn-capture');
                const originalText = "Export";
                const placedMagnets = magnetElements.filter(el => el.dataset.moved === "true");
                if (placedMagnets.length === 0) return;
                btn.innerHTML = `Saving`;
                btn.disabled = true;

                try {
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    const fridgeRect = fridgeEl.getBoundingClientRect();
                    placedMagnets.forEach(el => {
                        const rect = el.getBoundingClientRect();
                        const x = rect.left - fridgeRect.left;
                        const y = rect.top - fridgeRect.top;
                        if (x < minX) minX = x;
                        if (y < minY) minY = y;
                        if (x + rect.width > maxX) maxX = x + rect.width;
                        if (y + rect.height > maxY) maxY = y + rect.height;
                    });

                    const poemWidth = maxX - minX;
                    const poemHeight = maxY - minY;
                    const targetCenterX = fridgeEl.offsetWidth / 2;
                    const targetCenterY = fridgeEl.offsetHeight / 2;
                    const shiftX = targetCenterX - (minX + poemWidth/2);
                    const shiftY = targetCenterY - (minY + poemHeight/2);

                    const exportContainer = document.createElement('div');
                    exportContainer.style.width = `${fridgeEl.offsetWidth}px`;
                    exportContainer.style.height = `${fridgeEl.offsetHeight}px`;
                    exportContainer.style.background = `linear-gradient(to bottom right, ${color1El.value}, ${color2El.value})`;
                    exportContainer.style.position = 'fixed';
                    exportContainer.style.left = '-9999px'; 
                    exportContainer.style.top = '0';
                    exportContainer.style.fontFamily = 'Arial, Helvetica, sans-serif';

                    placedMagnets.forEach(el => {
                        const clone = el.cloneNode(true);
                        const origLeft = parseFloat(el.style.left) || 0;
                        const origTop = parseFloat(el.style.top) || 0;
                        clone.style.position = 'absolute';
                        clone.style.left = `${origLeft + shiftX}px`;
                        clone.style.top = `${origTop + shiftY}px`;
                        clone.style.transform = el.style.transform || 'none';
                        clone.style.opacity = '1';
                        clone.classList.remove('dragging');
                        clone.style.transition = 'none'; 
                        exportContainer.appendChild(clone);
                    });

                    document.body.appendChild(exportContainer);
                    const dataUrl = await domtoimage.toPng(exportContainer, {
                        width: fridgeEl.offsetWidth * 3,
                        height: fridgeEl.offsetHeight * 3,
                        style: { transform: `scale(3)`, transformOrigin: 'top left', width: `${fridgeEl.offsetWidth}px`, height: `${fridgeEl.offsetHeight}px` }
                    });
                    exportContainer.remove();

                    const sorted = [...placedMagnets].sort((a,b) => {
                        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
                        return Math.abs(ra.top - rb.top) < 15 ? ra.left - rb.left : ra.top - rb.top;
                    });
                    const slug = sorted.slice(0,3).map(e => e.textContent.replace(/\W/g,'')).join('-') || 'poem';
                    const ts = new Date().toISOString().replace(/[:.]/g,'-');
                    const link = document.createElement('a');
                    link.download = `${slug}-${ts}.png`;
                    link.href = dataUrl;
                    link.click();
                } catch (err) {
                    console.error(err);
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });

            document.addEventListener('keydown', (e) => { 
                if (e.key === 'Escape') { 
                    const m = document.getElementById('help-modal'); 
                    if(m && !m.classList.contains('hidden')) toggleHelp(); 
                } 
            });

            color1El.value = generateRandomPastel();
            color2El.value = generateRandomPastel();
            updateBg();
            spawnWords(randomGenre);
        }

        let activeMagnet = null;
        let offset = { x: 0, y: 0 };

        document.addEventListener('pointerdown', (e) => {
            // Init audio context on first user interaction
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const target = e.target.closest('.magnet');
            if (target) {
                activeMagnet = target;
                if (activeMagnet.parentElement === magnetStripEl) {
                    const rect = activeMagnet.getBoundingClientRect();
                    activeMagnet.classList.remove('in-strip');
                    fridgeEl.appendChild(activeMagnet);
                    const fridgeRect = fridgeEl.getBoundingClientRect();
                    activeMagnet.style.position = 'absolute';
                    activeMagnet.style.left = (rect.left - fridgeRect.left) + 'px';
                    activeMagnet.style.top = (rect.top - fridgeRect.top) + 'px';
                    offset.x = e.clientX - rect.left;
                    offset.y = e.clientY - rect.top;
                } else {
                    const rect = activeMagnet.getBoundingClientRect();
                    offset.x = e.clientX - rect.left;
                    offset.y = e.clientY - rect.top;
                }
                highestZ++;
                activeMagnet.style.zIndex = highestZ;
                activeMagnet.classList.add('dragging');
                activeMagnet.classList.add('on-board');
                activeMagnet.setPointerCapture(e.pointerId);
                e.preventDefault(); 
            }
        });

        document.addEventListener('pointermove', (e) => {
            if (!activeMagnet) return;
            const fridgeRect = fridgeEl.getBoundingClientRect();
            let newLeft = e.clientX - fridgeRect.left - offset.x;
            let newTop = e.clientY - fridgeRect.top - offset.y;
            activeMagnet.style.left = `${newLeft}px`;
            activeMagnet.style.top = `${newTop}px`;
        });

        document.addEventListener('pointerup', (e) => {
            if (activeMagnet) {
                activeMagnet.classList.remove('dragging');
                const stripRect = magnetStripEl.getBoundingClientRect();
                if (e.clientY >= stripRect.top) {
                    activeMagnet.classList.remove('on-board');
                    activeMagnet.classList.add('in-strip');
                    activeMagnet.style.left = '';
                    activeMagnet.style.top = '';
                    activeMagnet.style.position = '';
                    activeMagnet.dataset.moved = "false";
                    magnetStripEl.appendChild(activeMagnet);
                } else {
                    activeMagnet.dataset.moved = "true";
                    const fridgeRect = fridgeEl.getBoundingClientRect();
                    const magRect = activeMagnet.getBoundingClientRect();
                    let finalLeft = parseFloat(activeMagnet.style.left);
                    let finalTop = parseFloat(activeMagnet.style.top);
                    if (finalLeft < 0) finalLeft = 0;
                    if (finalTop < 0) finalTop = 0;
                    if (finalLeft + magRect.width > fridgeRect.width) finalLeft = fridgeRect.width - magRect.width;
                    if (finalTop + magRect.height > fridgeRect.height) finalTop = fridgeRect.height - magRect.height;
                    activeMagnet.style.left = `${finalLeft}px`;
                    activeMagnet.style.top = `${finalTop}px`;
                }
                
                // Moved outside the 'else' block so it plays for all drops
                playStickSound();

                activeMagnet.releasePointerCapture(e.pointerId);
                activeMagnet = null;
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
